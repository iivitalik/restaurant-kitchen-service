{% extends "base.html" %}

{% block content %}
  <h1>Ingredients List</h1>

  {% if ingredient_list %}
    <ul>
      {% for ingredient in ingredient_list %}
        <li><a href="{% url 'kitchen:ingredient-detail' pk=ingredient.id %}">
          {{ ingredient.name }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no Ingredients in the service</p>
  {% endif %}
{% endblock %}
